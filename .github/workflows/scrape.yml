name: "Weekly Cultural Events Scraper"

on:
    schedule:
      - cron: '0 12 * * 1' # Se ejecuta cada lunes a las 12:00 UTC
    workflow_dispatch: {} # Tambien se puede lanzar a mano cuando quieras

jobs:
    scrape:
      # zaragoza.es bloquea las IPs de los runners cloud de GitHub, así que
      # esto se ejecuta en un runner "self-hosted" (el PC de Jesús), que usa
      # una conexión residencial normal y no está bloqueado.
      runs-on: self-hosted
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: '3.12'
        - shell: bash
          run: |
            pip install -r backend/requirements.txt
            playwright install chromium
        - shell: bash
          run: python backend/scraper/scraper.py
          env:
            MONGODB_URI: ${{ secrets.MONGODB_URI }}
