name: "Cultural Events Scraper"

on:
    schedule:
      - cron: '0 12 */2 * *' # Se ejecuta cada 2 dias a las 12:00 UTC
    workflow_dispatch: {} # Tambien se puede lanzar a mano cuando quieras

jobs:
    scrape:
      # zaragoza.es bloquea las IPs de los runners cloud de GitHub, así que
      # esto se ejecuta en un runner "self-hosted" (el PC de Jesús), que usa
      # una conexión residencial normal y no está bloqueado.
      runs-on: self-hosted
      steps:
        - uses: actions/checkout@v4
        # No usamos actions/setup-python aqui: su instalador silencioso de
        # Python falla en este PC (MSI error 1603 en el paquete "dev", causa
        # nunca resuelta). En su lugar usamos el Python ya instalado en el
        # sistema (C:\Program Files\Python312), instalado a mano una vez.
        - run: |
            python --version
            python -m pip install -r backend/requirements.txt
            python -m playwright install chromium
        - run: python backend/scraper/scraper.py
          env:
            MONGODB_URI: ${{ secrets.MONGODB_URI }}
        # Busca imágenes de reserva (Groq + Pexels). Si faltan las claves o
        # falla, no rompe el scraping: la app usa una ilustración por categoría.
        - run: python backend/scraper/enrich_images.py
          continue-on-error: true
          env:
            MONGODB_URI: ${{ secrets.MONGODB_URI }}
            GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
            PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        # Monumentos y museos (datos abiertos del Ayuntamiento) para la app.
        - run: python backend/scraper/places.py
          continue-on-error: true
          env:
            MONGODB_URI: ${{ secrets.MONGODB_URI }}
